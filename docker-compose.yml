services:
  comfyui:
    image: ghcr.io/ai-dock/comfyui:latest-cuda
    container_name: comfyui
    restart: "no"
    ipc: host
    shm_size: "16gb"

    ports:
      - "8188:8188"
      
    environment:
      - COMFYUI_PORT_HOST=8188
      # AUTO_UPDATE disabled: ai-dock would self-pull/recreate the container at
      # startup and clobber our pinned torch. Updates are done deliberately via
      # ./update.sh and ./update_nodes.sh.
      - AUTO_UPDATE=false
      - PYTHONWARNINGS=ignore
      - SUPERVISOR_NO_AUTOSTART=cloudflared,quicktunnel
      - WEB_ENABLE_AUTH=false
      - CM_BYPASS_SECURITY_CHECK=1
      - PYTHONPATH=/opt/ComfyUI
      # NOTE: --use-xformers removed on purpose. Do not enable it here without
      # re-testing on the P100; the pinned stack uses native torch attention.
      # NOTE: --normalvram removed: it is no longer a valid ComfyUI flag in current
      # master (it aborts startup on argument parsing). Normal VRAM is the default.
      # NOTE: this ai-dock image reads COMFYUI_ARGS, not ARGS. The old ARGS key was
      # silently ignored, so none of the intended flags were ever applied.
      # NOTE: --lowvram is intentionally NOT enabled. The baseline completed Boogu
      # at 11.97 GB peak on NORMAL_VRAM. Add it only if a future model actually OOMs.
      - COMFYUI_ARGS=--fp16-vae
      - PYTORCH_CUDA_ALLOC_CONF=garbage_collection_threshold:0.8,max_split_size_mb:64
      - COMFYUI_MANAGER_PYTHON_EXE=/opt/environments/python/comfyui/bin/python      
      # Explicitly declare runtime visibility inside the wrapper
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=all

    volumes:
      - comfyui-venv-storage:/opt/environments/python/comfyui
      - ./provisioning.sh:/opt/ai-dock/bin/provisioning.sh
      - /home/nui/dev/ComfyUI:/opt/ComfyUI

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu, compute, utility, video]

volumes:
  comfyui-venv-storage:
