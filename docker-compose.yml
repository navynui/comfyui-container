services:
  comfyui:
    image: ghcr.io/ai-dock/comfyui:latest-cuda
    container_name: comfyui
    restart: "no"
    ipc: host
    shm_size: "16gb"

    ports:
      - "8188:18188"
      
    environment:
      - COMFYUI_PORT_HOST=8188
      # AUTO_UPDATE disabled: ai-dock would self-pull/recreate the container at
      # startup and clobber our pinned torch. Updates are done deliberately via
      # ./update.sh and ./update_nodes.sh.
      - AUTO_UPDATE=false
      - PYTHONWARNINGS=ignore
      - SUPERVISOR_NO_AUTOSTART=cloudflared,quicktunnel
      - WEB_ENABLE_AUTH=false
      - CM_BYPASS_SECURITY_CHECK=1
      - PYTHONPATH=/opt/ComfyUI
      # P100 (sm_60) launch flags — see research.md and tesla_p100_comfyui_optimization_plan.md
      # --fp16-vae: VAE in fp16 (Phase 1: small consistent win, output verified identical)
      # --force-fp32 / --use-pytorch-cross-attention: REMOVED — Z-Image regressed ~20%
      #   (fp32 increases VRAM pressure on 16 GB card; SDPA already the default backend)
      # --fast-disk REMOVED: caused 71% Z-Image slowdown; container disk slower than RAM
      - COMFYUI_ARGS=--fp16-vae --listen 0.0.0.0
      # Prevent newer PyTorch from JIT-compiling Triton kernels (fails without a C compiler
      # in the image; sm_60 has no tensor cores anyway).
      - TORCH_DISABLE_NATIVE_JIT=1
      - PYTORCH_CUDA_ALLOC_CONF=garbage_collection_threshold:0.8,max_split_size_mb:64
      - COMFYUI_MANAGER_PYTHON_EXE=/opt/environments/python/comfyui/bin/python      
      # Explicitly declare runtime visibility inside the wrapper
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=all

    volumes:
      - comfyui-venv-final:/opt/environments/python/comfyui
      - ./provisioning.sh:/opt/ai-dock/bin/provisioning.sh
      - /home/nui/dev/ComfyUI:/opt/ComfyUI

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu, compute, utility, video]
    # Start ComfyUI directly (bypass ai-dock init.sh which crashes on exit).
    # ComfyUI listens on port 18188 inside the container, mapped to 8188 on host.
    command: ["bash", "-c", "sleep 2 && /opt/environments/python/comfyui/bin/python /opt/ComfyUI/main.py --disable-auto-launch --fp16-vae --listen 0.0.0.0 --port 18188"]

volumes:
  comfyui-venv-final:
    external: true
